name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PR: build only to validate the Dockerfile, don't push
      - uses: docker/build-push-action@v7
        if: github.event_name == 'pull_request'
        with:
          context: .
          push: false

      # Push to main: build once, tag with branch name + commit sha
      - uses: docker/metadata-action@v6
        id: meta-build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short

      - uses: docker/build-push-action@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          context: .
          push: true
          tags: ${{ steps.meta-build.outputs.tags }}
          labels: ${{ steps.meta-build.outputs.labels }}

      # Push a version tag (v*): don't rebuild — promote the existing
      # sha-tagged image (already built from the main push) to release tags
      - uses: docker/setup-buildx-action@v4
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Compute short SHA of the tagged commit
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_ENV"

      - uses: docker/metadata-action@v6
        id: meta-release
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}

      - name: Promote existing image (by sha) to release tags instead of rebuilding
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ steps.meta-release.outputs.tags }}" | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create -t "$tag" "ghcr.io/${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}"
          done
      
  deploy:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          port: ${{ secrets.EC2_PORT }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/myapp
            /opt/homebrew/bin/podman compose pull
            /opt/homebrew/bin/podman compose up -d

